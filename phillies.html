  accts.map(([hd,nm,role],i)=>`<div class="acct ${XSEL===hd?'sel':''}" ${XEDIT?'':`onclick="xPick('${hd}')"`}><div class="av">${esc(nm.split(' ').map(w=>w[0]).join('').slice(0,2))}</div><div style="min-width:0"><b>${esc(nm)}</b><span>@${esc(hd)}${role?' · '+esc(role):''}</span></div>${XEDIT?`<span class="rm" onclick="xRemove(${i})">×</span>`:`<span class="go">${XSEL===hd?'Showing ▾':'View feed ›'}</span>`}</div>`).join('')+
  (XEDIT?`<div class="xadd"><input id="xin" placeholder="@handle" autocapitalize="off" autocorrect="off"><button onclick="xAdd()">Add</button></div>
    <button class="xedit" style="margin-top:10px" onclick="delete XS[XSEC];xSave();renderX()">Reset to defaults</button>`:'')+`</div>`;
  if(XEDIT) h+=`<div class="card"><h2>Accounts on Bluesky</h2>`+bsAccts(XSEC).map(([hd,nm],i)=>`<div class="acct"><div class="av">${esc(nm.split(' ').map(w=>w[0]).join('').slice(0,2))}</div><div style="min-width:0"><b>${esc(nm)}</b><span>@${esc(hd)}</span></div><span class="rm" onclick="bsRemove(${i})">×</span></div>`).join('')+
    `<div class="xadd"><input id="bsin" placeholder="name.bsky.social" autocapitalize="off" autocorrect="off"><button onclick="bsAdd()">Add</button></div><button class="xedit" style="margin-top:10px" onclick="delete BSS[XSEC];bsSave();renderX()">Reset to defaults</button></div>`;
  if(XSEL&&!XEDIT) h+=`<div class="card"><h2>@${esc(XSEL)} <a class="xedit" style="text-decoration:none" href="https://x.com/${encodeURIComponent(XSEL)}" target="_blank" rel="noopener">Open in X ›</a></h2><div class="xembed" id="xembed"><div class="xnote">Loading posts…</div></div></div>`;
  else if(!XEDIT) h+=`<div class="xnote" style="padding:0 4px">Top posts and Latest open X. The Bluesky feed above shows real posts right here. Tap an X account to try its feed in-app.</div>`;
  document.getElementById('xfeed').innerHTML=h;
  if(XSEL&&!XEDIT)xEmbed(XSEL);
  if(!XEDIT)loadBsky(XSEC);
}
function xPick(hd){XSEL=XSEL===hd?null:hd;renderX()}
function xRemove(i){const a=[...xAccts(XSEC)];a.splice(i,1);XS[XSEC]=a;xSave();renderX()}
function xAdd(){const v=(document.getElementById('xin').value||'').trim().replace(/^@/,'').replace(/[^A-Za-z0-9_]/g,'');if(!v)return;XS[XSEC]=[...xAccts(XSEC),[v,'@'+v,'']];xSave();renderX()}
// X's own embed script: shows the account's recent posts when X allows it; otherwise falls back to a link.
let twLoad=null;
function xEmbed(hd){
  const box=document.getElementById('xembed');
  box.innerHTML=`<a class="twitter-timeline" data-theme="dark" data-chrome="noheader nofooter noborders transparent" data-height="640" data-dnt="true" href="https://twitter.com/${encodeURIComponent(hd)}"></a>`;
  if(!twLoad)twLoad=new Promise(r=>{const sc=document.createElement('script');sc.src='https://platform.twitter.com/widgets.js';sc.async=true;sc.onload=()=>r(window.twttr);sc.onerror=()=>r(null);document.head.appendChild(sc)});
  twLoad.then(tw=>{try{tw&&tw.widgets.load(box)}catch(e){}});
  setTimeout(()=>{if(document.getElementById('xembed')===box&&!box.querySelector('iframe'))
    box.innerHTML=`<div class="xnote">X didn't show the feed here (X often requires you to be signed in for embedded feeds).</div><a class="xbtn" style="margin-top:10px" href="https://x.com/${encodeURIComponent(hd)}" target="_blank" rel="noopener">Open @${esc(hd)} in X</a>`},7000);
}

/* ---------- Bluesky: real posts, free public API ---------- */
const BS_API=['https://public.api.bsky.app/xrpc/','https://api.bsky.app/xrpc/'];
const DEV_RE=/phillies|philadelphia|phi|harper|schwarber|trea turner|wheeler|nola|realmuto|thomson|dombrowski|citizens bank park/i;
async function bsGet(path){let err;for(const b of BS_API){try{return await getJSON(b+path)}catch(e){err=e}}throw err}
function bsCardHTML(){
  const list=bsAccts(XSEC), q=BS_SEARCH[XSEC];
  if(!list.length&&!q)return '';
  return `<div class="card"><h2>On Bluesky <span class="bsbadge">REAL POSTS · LIVE</span></h2>
   <div class="bsbar"><button class="${BSORT==='top'?'on':''}" onclick="BSORT='top';renderBs()">🔥 Top</button><button class="${BSORT==='new'?'on':''}" onclick="BSORT='new';renderBs()">⚡ Latest</button>
   ${XSEC==='trade'?`<button class="${BDEV?'on':''}" onclick="BDEV=!BDEV;renderBs()">${SHORT} only</button>`:''}</div>
   <div class="bsf" id="bsfeed"><div class="xnote" style="padding:10px 0">Loading posts…</div></div></div>`;
}
async function loadBsky(k){
  clearTimeout(bstimer);
  const list=bsAccts(k), q=BS_SEARCH[k];
  if(!list.length&&!q)return;
  if(BSCACHE[k])renderBs();
  const jobs=list.map(([hd])=>bsGet(`app.bsky.feed.getAuthorFeed?actor=${encodeURIComponent(hd)}&limit=30&filter=posts_no_replies`).then(r=>r.feed||[]).catch(()=>[]));
  if(q)jobs.push(bsGet(`app.bsky.feed.searchPosts?q=${encodeURIComponent(q)}&sort=top&limit=40`).then(r=>(r.posts||[]).map(post=>({post}))).catch(()=>[]));
  const res=(await Promise.all(jobs)).flat();
  const seen=new Set(), posts=[];
  for(const it of res){const p=it.post; if(!p||seen.has(p.uri)||it.reason)continue; seen.add(p.uri); posts.push(p)}
  BSCACHE[k]={posts,at:Date.now(),ok:res.length>0};
  if(XSEC===k)renderBs();
  bstimer=setTimeout(()=>{if(TAB==='news'&&NSEC==='x'&&!document.hidden)loadBsky(XSEC)},120e3);
}
const ago=d=>{const m=Math.max(1,Math.round((Date.now()-new Date(d))/60000));return m<60?m+'m':m<1440?Math.round(m/60)+'h':Math.round(m/1440)+'d'};
function renderBs(){
  const el=document.getElementById('bsfeed'); if(!el)return;
  document.querySelectorAll('.bsbar button').forEach(b=>{const t=b.textContent;b.classList.toggle('on',(t.includes('Top')&&BSORT==='top')||(t.includes('Latest')&&BSORT==='new')||(t.includes(' only')&&BDEV))});
  const c=BSCACHE[XSEC]; if(!c)return;
  let ps=c.posts.filter(p=>p.record?.text!=null);
  if(XSEC==='trade'&&BDEV)ps=ps.filter(p=>DEV_RE.test(p.record.text+' '+(p.embed?.external?.title||'')));
  const wk=Date.now()-7*864e5;
  if(BSORT==='top'){ps=ps.filter(p=>new Date(p.indexedAt)>wk).sort((a,b)=>((b.likeCount||0)+2*(b.repostCount||0))-((a.likeCount||0)+2*(a.repostCount||0)))}
  else ps.sort((a,b)=>new Date(b.indexedAt)-new Date(a.indexedAt));
  ps=ps.slice(0,15);
  if(!ps.length){el.innerHTML=`<div class="xnote" style="padding:10px 0">${c.ok?(XSEC==='trade'&&BDEV?`No ${SHORT} talk from these insiders this week. Turn off "${SHORT} only" to see everything.`:'No recent posts.'):'Couldn\'t reach Bluesky right now. This works once the app is online (GitHub).'}</div>`;return}
  el.innerHTML=ps.map(p=>{
    const a=p.author||{}, nm=a.displayName||a.handle, id=(p.uri||'').split('/').pop();
    const ext=p.embed?.external||p.embed?.media?.external;
    const hasImg=/images|video/.test(p.embed?.$type||'')||/images|video/.test(p.embed?.media?.$type||'');
    return `<a class="post" href="https://bsky.app/profile/${encodeURIComponent(a.handle)}/post/${id}" target="_blank" rel="noopener">
      <div class="ph"><div class="av">${esc((nm||'?').split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase())}</div><b>${esc(nm)}</b><span>@${esc(a.handle)}</span><span class="ago">${ago(p.indexedAt)}</span></div>
      <div class="tx">${esc(p.record.text)}</div>
      ${ext?`<div class="lk"><b>${esc(ext.title||'')}</b>${esc((ext.uri||'').replace(/^https?:\/\/(www\.)?/,'').split('/')[0])}</div>`:''}
      ${hasImg?`<div class="lk">📷 Photo or video: tap to view on Bluesky</div>`:''}
      <div class="en"><span>♥ ${p.likeCount||0}</span><span>⟲ ${p.repostCount||0}</span><span>💬 ${p.replyCount||0}</span></div></a>`}).join('');
}
function bsRemove(i){const a=[...bsAccts(XSEC)];a.splice(i,1);BSS[XSEC]=a;bsSave();delete BSCACHE[XSEC];renderX()}
function bsAdd(){let v=(document.getElementById('bsin').value||'').trim().replace(/^@/,'').toLowerCase();if(!v)return;if(!v.includes('.'))v+='.bsky.social';BSS[XSEC]=[...bsAccts(XSEC),[v,v.split('.')[0],'']];bsSave();delete BSCACHE[XSEC];renderX()}

/* Home tab icon: team logo as a one-colour shape */
(async()=>{try{let blob=null;for(const u of ['data/mlb-logo.png',`https://raw.githubusercontent.com/${REPO}/main/data/mlb-logo.png`,'https://a.espncdn.com/i/teamlogos/mlb/500/phi.png']){try{const r=await fetch(u,{mode:'cors'});if(r.ok&&/image/.test(r.headers.get('content-type')||'')){blob=await r.blob();break}}catch(e){}}
 if(!blob)throw 0;const img=await createImageBitmap(blob),S=96,c=document.createElement('canvas');c.width=c.height=S;const x=c.getContext('2d');const k=Math.min(S/img.width,S/img.height);x.drawImage(img,(S-img.width*k)/2,(S-img.height*k)/2,img.width*k,img.height*k);
 const d=x.getImageData(0,0,S,S),p=d.data;for(let i=0;i<p.length;i+=4){const l=(0.2126*p[i]+0.7152*p[i+1]+0.0722*p[i+2])/255;p[i+3]=p[i+3]*(l>0.82?0:1);p[i]=p[i+1]=p[i+2]=0}x.putImageData(d,0,0);
 const el=$('tlogo');el.style.webkitMaskImage=el.style.maskImage=`url(${c.toDataURL()})`;$('tabbar').classList.add('haslogo')}catch(e){}})();

/* Flyers | Phillies switch */
const SWITCH=[['Flyers','index.html','https://a.espncdn.com/i/teamlogos/nhl/500/phi.png'],['Phillies','phillies.html','https://a.espncdn.com/i/teamlogos/mlb/500/phi.png']];
$('tswitch').innerHTML=SWITCH.map(([l,h,img])=>`<a class="${h===PAGE?'on':''}" href="${h}"><img src="${img}" alt="">${l}</a>`).join('');

load(); go(TABS.includes(CFG.startTab)?CFG.startTab:'home'); setInterval(()=>{if(!document.hidden)load()},600e3);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});
</script>
