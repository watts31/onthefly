name: Update player stats
on:
  schedule:
    - cron: '17 * * * *'   # every hour
  workflow_dispatch:
  push:
    paths: ['scripts/fetch-stats.mjs', '.github/workflows/stats.yml']
permissions:
  contents: write
concurrency: stats
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch-stats.mjs
      - name: Save if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/players.json
          git diff --cached --quiet || (git commit -m "Update player stats" && git pull --rebase && git push)
