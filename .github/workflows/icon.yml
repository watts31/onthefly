name: Build app icon
on:
  workflow_dispatch:
  push:
    paths: ['scripts/make-icon.py', '.github/workflows/icon.yml']
permissions:
  contents: write
jobs:
  icon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet pillow && python3 scripts/make-icon.py
      - name: Save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/icon-*.png
          git diff --cached --quiet && exit 0
          git commit -m "Build app icon"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
