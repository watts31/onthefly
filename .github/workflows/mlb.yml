name: Update Phillies data
on:
  schedule:
    - cron: '37 */3 * * *'   # every 3 hours
  workflow_dispatch:
  push:
    paths: ['scripts/fetch-mlb.mjs', '.github/workflows/mlb.yml']
permissions:
  contents: write
concurrency: mlb
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch-mlb.mjs
      - name: Save if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          git diff --cached --quiet && exit 0
          git commit -m "Update Phillies data"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
