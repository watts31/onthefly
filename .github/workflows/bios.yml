name: Update player cards
on:
  schedule:
    - cron: '59 10 * * *'   # once a day (about 6 AM Eastern)
  workflow_dispatch:
  push:
    paths: ['scripts/fetch-bios.mjs', '.github/workflows/bios.yml']
permissions:
  contents: write
concurrency: bios
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch-bios.mjs
      - name: Save if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bios.json data/bios 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "Update player cards"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
